name: RokuPilot
options:
  bundleIdPrefix: com.aj
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RokuPilot:
    type: application
    platform: iOS
    sources:
      - RokuPilot
    info:
      path: RokuPilot/Info.plist
      properties:
        CFBundleDisplayName: Pilot
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: Pilot controls your Roku TV over your home Wi-Fi.
        NSMicrophoneUsageDescription: Pilot listens when you tap the mic so you can talk to your TV.
        NSSpeechRecognitionUsageDescription: Pilot turns what you say into commands for your TV.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aj.RokuPilot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
